services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8028}:8000"
    volumes:
      - wind-data:/app/data
    environment:
      DATA_DIR: /app/data/workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  wind-data:
