[project]
name = "wind-data-explorer"
version = "0.1.0"
description = "Данные ВЭС и архивные прогнозы погоды — HackAlem AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "scikit-learn>=1.5,<2",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "xarray>=2025.1,<2027",
  "icechunk>=1.1,<3",
  "zarr>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wind", "src/wind_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
